# Banco PostgreSQL para DESENVOLVIMENTO LOCAL do backend.
# O docker-compose completo (front + back + banco) é a task #6 e fica na raiz do repo.
services:
  postgres:
    image: postgres:17-alpine
    container_name: ache-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ache}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ache123}
      POSTGRES_DB: ${POSTGRES_DB:-ache_petrolina}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
