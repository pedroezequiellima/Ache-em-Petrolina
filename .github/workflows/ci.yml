name: CI Pipeline

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Instalar dependências raiz
        run: npm install

      # =========================
      # BACKEND (NestJS/Prisma)
      # =========================
      - name: Backend - Instalar dependências
        run: npm install
        working-directory: ./apps/backend

      - name: Backend - Gerar cliente Prisma
        run: npx prisma generate
        working-directory: ./apps/backend

      - name: Backend - Lint
        run: npm run lint --if-present
        working-directory: ./apps/backend

      - name: Backend - Testes
        run: npm run test --if-present
        working-directory: ./apps/backend

      - name: Backend - Build
        run: npm run build
        working-directory: ./apps/backend

      # =========================
      # FRONTEND (Next.js)
      # =========================
      - name: Frontend - Instalar dependências
        run: npm install
        working-directory: ./apps/frontend

      - name: Frontend - Lint
        run: npm run lint --if-present
        working-directory: ./apps/frontend

      - name: Frontend - Testes
        run: npm run test --if-present
        working-directory: ./apps/frontend

      - name: Frontend - Build
        run: npm run build
        working-directory: ./apps/frontend